<div id="grid"></div>
<button id="next">Next generation</button>

<script>
  // Your code here.
  let width = 30, height = 15;

  // Initialize a random grid using Math.random
  let grid = Array(width * height).fill(false).map(() => Math.random() < 0.3);

  let gridDiv = document.querySelector("#grid");

  // Create checkboxes for each cell
  let checkboxes = [];
  for (let y = 0; y < height; y++) {
    let row = [];
    for (let x = 0; x < width; x++) {
      let box = document.createElement("input");
      box.type = "checkbox";
      box.checked = grid[y * width + x];
      gridDiv.appendChild(box);
      row.push(box);
    }
    checkboxes.push(row);
    gridDiv.appendChild(document.createElement("br"));
  }

  function update() {
    // Read the current state from the checkboxes
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        grid[y * width + x] = checkboxes[y][x].checked;
      }
    }

    // Compute the next generation
    let newGrid = grid.map((_, index) => {
      let x = index % width;
      let y = Math.floor(index / width);
      let neighbors = 0;

      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          if (dx === 0 && dy === 0) continue;
          let nx = x + dx, ny = y + dy;
          if (nx >= 0 && nx < width && ny >= 0 && ny < height) {
            if (grid[ny * width + nx]) neighbors++;
          }
        }
      }

      let alive = grid[index];
      if (alive && (neighbors < 2 || neighbors > 3)) return false;
      if (!alive && neighbors === 3) return true;
      return alive;
    });

    grid = newGrid;

    // Update the checkbox display
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        checkboxes[y][x].checked = grid[y * width + x];
      }
    }
  }

  document.querySelector("#next").addEventListener("click", update);
</script>
